name: Multi-Repo Monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  monitor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: "bitcoin/bitcoin"
            branch: "master"
          - repo: "ethereum/go-ethereum"
            branch: "main"
          - repo: "lightningnetwork/lnd"
            branch: "master"
          - repo: "cosmos/cosmos-sdk"
            branch: "main"

    steps:
      - name: Fetch and Send
        run: |
          RESPONSE=\$(curl -s "https://github.com matrix.repo /commits/{{ matrix.branch }}")
          SHA=(echo "RESPONSE" | jq -r '.sha' | cut -c1-7)
          AUTHOR=(echo "RESPONSE" | jq -r '.commit.author.name')
          MESSAGE=(echo "RESPONSE" | jq -r '.commit.message' | head -n 3)
          URL=(echo "RESPONSE" | jq -r '.html_url')
          
          TEXT="⚠️ *New Commit to  matrix.repo :{{ matrix.branch }}*%0A%0A*SHA:* \`$SHA\`%0A*Author:* \$AUTHOR%0A*Message:*%0A\(MESSAGE\%0A\%0A[View on GitHub](\)URL)"
          
          curl -s -X POST "https://telegram.org\${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=\${{ secrets.TELEGRAM_TO }}" \
            -d "text=\$TEXT" \
            -d "parse_mode=Markdown"
