name: Token GitHub Monitor (Four-Layer Funnel + Dual-Track)

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore/Save Commit Cache
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .commit_cache
          key: commit-cache-all-repos-${{ github.run_id }}
          restore-keys: |
            commit-cache-all-repos-

      - name: Fetch, Filter and Notify All Repos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLASS_A_REPOS=(
            "starknet-io/SNIPs" "sui-foundation/sips" "ArbitrumFoundation/governance" "ZKsync-Association/zk-governance"
            "aave-dao/aave-proposals-v3" "ethereum/consensus-specs" "ethereum-optimism/specs" "monad-crypto/protocols"
          )

          CLASS_B_REPOS=(
            "ethereum/go-ethereum" "anza-xyz/agave" "bitcoin/bitcoin" "crypto-org-chain/cronos"
            "maticnetwork/bor" "offchainlabs/nitro" "ethereum-optimism/op-geth" "bnb-chain/bsc"
            "ava-labs/avalanchego" "aptos-labs/aptos-core" "monero-project/monero" "IntersectMBO/cardano-node"
            "paritytech/polkadot-sdk" "cosmos/gaia" "ton-blockchain/ton" "mystenlabs/sui"
            "ledgerwatch/erigon" "paradigmxyz/reth" "flashbots/mev-boost" "availproject/avail"
            "celestiaorg/celestia-core" "0xsoniclabs/sonic" "movementlabsxyz/movement" "category-labs/monad"
            "category-labs/monad-bft" "MinaProtocol/mina" "AleoHQ/snarkOS" "Electric-Coin-Company/zcash"
            "ZcashFoundation/zebra" "XRPLF/rippled" "base/base" "LayerZero-Labs/LayerZero-v2"
            "RaoFoundation/subtensor" "berachain/beacon-kit" "filecoin-project/lotus" "stacks-network/stacks-core"
            "near/nearcore" "sei-protocol/sei-chain" "matter-labs/zksync-era" "scroll-tech/scroll"
            "taikoxyz/taiko-mono" "Layr-Labs/eigenlayer-contracts" "Layr-Labs/eigenlayer-middleware" "babylonlabs-io/babylon"
            "hyperlane-xyz/hyperlane-monorepo" "jito-foundation/jito-solana" "sigp/lighthouse" "matter-labs/era-contracts"
            "celestiaorg/celestia-app"
          )

          CACHE_DIR=".commit_cache"
          mkdir -p "$CACHE_DIR"

          escape_html() {
            printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
          }

          send_telegram() {
            local msg="$1"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=true" \
              --data-urlencode "text=${msg}" > /dev/null
            sleep 1
          }

          process_single_commit() {
            local TARGET_REPO="$1"
            local REPO_CLASS="$2"
            local COMMIT_DATA="$3"

            local SHA=$(printf '%s' "$COMMIT_DATA" | jq -r '.sha')
            local FULL_MESSAGE_RAW=$(printf '%s' "$COMMIT_DATA" | jq -r '.message')
            local FIRST_LINE=$(printf '%s\n' "$FULL_MESSAGE_RAW" | head -n 1)
            local FIRST_LINE_LOWER=$(printf '%s' "$FIRST_LINE" | tr '[:upper:]' '[:lower:]')

            local AUTHOR=$(printf '%s' "$COMMIT_DATA" | jq -r '.author')
            local LOGIN=$(printf '%s' "$COMMIT_DATA" | jq -r '.login // ""')
            local AUTHOR_LOWER=$(printf '%s %s' "$AUTHOR" "$LOGIN" | tr '[:upper:]' '[:lower:]')

            local TAG_LABEL=""

            if [ "$REPO_CLASS" = "A" ]; then
              TAG_LABEL="🏛️【治理与协议规范】"
            else
              if printf '%s' "$AUTHOR_LOWER" | grep -Eq '(dependabot|renovate|github-actions|mergify)\[bot\]|^dependabot$|^renovate$'; then
                echo "已过滤机器人提交 ($AUTHOR): $FIRST_LINE"
                return
              fi

              local WHITELIST_REGEX='(release|mainnet|hardfork|hard-fork|hard fork|activation|upgrade|epoch|protocol[ _-]?version|emission|tokenomics|fee|burn|staking|reward|slash|governance|compliance|freeze|(^|[^a-z0-9])(eip|sip|cip|nep|bip)-[0-9]+)'
              if printf '%s' "$FIRST_LINE_LOWER" | grep -Eq "$WHITELIST_REGEX"; then
                TAG_LABEL="🚨【核心升级/经济变动】"
              else
                local BLACKLIST_REGEX='^(docs?|tests?|ci|build|style|lint|refactor|chore\((deps|ci|infra)\)|fix\((rpc|test|prune|provider)\))([(:!]|$)'
                if printf '%s' "$FIRST_LINE_LOWER" | grep -Eq "$BLACKLIST_REGEX"; then
                  echo "已过滤工程噪音提交: $FIRST_LINE"
                  return
                fi
                TAG_LABEL="📌【常规功能迭代】"
              fi
            fi

            echo "命中推送规则 ($TAG_LABEL)！发送 Telegram 通知..."

            local SHORT_SHA=${SHA:0:7}
            local URL=$(printf '%s' "$COMMIT_DATA" | jq -r '.url')
            local UTC_MERGE_TIME=$(printf '%s' "$COMMIT_DATA" | jq -r '.merge_date')
            local BEIJING_MERGE_TIME=$(TZ="Asia/Shanghai" date -d "$UTC_MERGE_TIME" +"%Y-%m-%d %H:%M:%S" 2>/dev/null || printf '%s' "$UTC_MERGE_TIME")

            local SAFE_MESSAGE=$(printf '%s' "$COMMIT_DATA" | jq -r '.message[0:3600]')
            local MSG_LEN=$(printf '%s' "$COMMIT_DATA" | jq -r '.message | length')
            if [ "$MSG_LEN" -gt 3600 ]; then
              SAFE_MESSAGE="${SAFE_MESSAGE}...(内容过长已截断)"
            fi
            local ESCAPED_MESSAGE=$(escape_html "$SAFE_MESSAGE")
            local ESCAPED_AUTHOR=$(escape_html "$AUTHOR")

            local TEXT
            printf -v TEXT '%s\n\n📦 <b>仓库:</b> <code>%s</code>\n👤 <b>提交者:</b> <code>%s</code>\n🕒 <b>合并时间(北京):</b> <code>%s</code>\n🔗 <b>详情:</b> <a href="%s">查看 Commit (%s)</a>\n\n📝 <b>变动内容:</b>\n<code>%s</code>' \
              "$TAG_LABEL" "$TARGET_REPO" "$ESCAPED_AUTHOR" "$BEIJING_MERGE_TIME" "$URL" "$SHORT_SHA" "$ESCAPED_MESSAGE"

            send_telegram "$TEXT"
          }

          check_repo_commits() {
            local TARGET_REPO="$1"
            local REPO_CLASS="$2"

            echo "----------------------------------------"
            echo "[$REPO_CLASS 类] 正在检查提交: $TARGET_REPO"

            local COMMITS_JSON=$(gh api "repos/$TARGET_REPO/commits?per_page=15" --jq '[.[] | {sha: .sha, author: .commit.author.name, login: .author.login, message: .commit.message, url: .html_url, merge_date: .commit.committer.date}]' 2>/dev/null)

            if [ -z "$COMMITS_JSON" ] || [ "$COMMITS_JSON" = "null" ] || [ "$COMMITS_JSON" = "[]" ]; then
              echo "警告: 无法获取 $TARGET_REPO 的提交数据，跳过。"
              return
            fi

            local LATEST_SHA=$(printf '%s' "$COMMITS_JSON" | jq -r '.[0].sha')
            local REPO_FILE=$(printf '%s' "$TARGET_REPO" | tr '/' '_')

            local LAST_SHA=""
            if [ -f "$CACHE_DIR/$REPO_FILE" ]; then
              LAST_SHA=$(cat "$CACHE_DIR/$REPO_FILE")
            fi

            if [ "$LATEST_SHA" = "$LAST_SHA" ]; then
              echo "代码未变动，跳过通知。"
              return
            fi

            printf '%s' "$LATEST_SHA" > "$CACHE_DIR/$REPO_FILE"

            if [ -z "$LAST_SHA" ]; then
              local FIRST_COMMIT=$(printf '%s' "$COMMITS_JSON" | jq -c '.[0]')
              process_single_commit "$TARGET_REPO" "$REPO_CLASS" "$FIRST_COMMIT"
              return
            fi

            local NEW_COMMITS=()
            local COUNT=$(printf '%s' "$COMMITS_JSON" | jq 'length')
            for (( i=0; i<COUNT; i++ )); do
              local ITEM=$(printf '%s' "$COMMITS_JSON" | jq -c ".[$i]")
              local CUR_SHA=$(printf '%s' "$ITEM" | jq -r '.sha')
              if [ "$CUR_SHA" = "$LAST_SHA" ]; then
                break
              fi
              NEW_COMMITS+=("$ITEM")
            done

            local NEW_COUNT=${#NEW_COMMITS[@]}
            for (( i=NEW_COUNT-1; i>=0; i-- )); do
              process_single_commit "$TARGET_REPO" "$REPO_CLASS" "${NEW_COMMITS[$i]}"
            done
          }

          check_repo_release() {
            local TARGET_REPO="$1"
            echo "[$TARGET_REPO] 正在检查最新 Release..."

            local RELEASE_DATA=$(gh api "repos/$TARGET_REPO/releases?per_page=5" --jq '[.[] | select(.draft == false)][0] | {tag: .tag_name, name: .name, prerelease: .prerelease, url: .html_url, published_at: .published_at, body: .body}' 2>/dev/null)

            if [ -z "$RELEASE_DATA" ] || [ "$RELEASE_DATA" = "null" ]; then
              return
            fi

            local TAG_NAME=$(printf '%s' "$RELEASE_DATA" | jq -r '.tag // ""')
            if [ -z "$TAG_NAME" ]; then
              return
            fi

            local REPO_FILE=$(printf '%s' "$TARGET_REPO" | tr '/' '_')
            local RELEASE_CACHE_FILE="$CACHE_DIR/${REPO_FILE}_release"

            local LAST_TAG=""
            if [ -f "$RELEASE_CACHE_FILE" ]; then
              LAST_TAG=$(cat "$RELEASE_CACHE_FILE")
            fi

            if [ "$TAG_NAME" = "$LAST_TAG" ]; then
              echo "版本未变动 ($TAG_NAME)，跳过。"
              return
            fi

            printf '%s' "$TAG_NAME" > "$RELEASE_CACHE_FILE"

            echo "检测到新版本发布 ($TAG_NAME)！发送高优 Telegram 警报..."

            local REL_NAME=$(printf '%s' "$RELEASE_DATA" | jq -r '.name // ""')
            local REL_URL=$(printf '%s' "$RELEASE_DATA" | jq -r '.url')
            local IS_PRE=$(printf '%s' "$RELEASE_DATA" | jq -r '.prerelease')
            local UTC_PUB_TIME=$(printf '%s' "$RELEASE_DATA" | jq -r '.published_at')
            local BEIJING_PUB_TIME=$(TZ="Asia/Shanghai" date -d "$UTC_PUB_TIME" +"%Y-%m-%d %H:%M:%S" 2>/dev/null || printf '%s' "$UTC_PUB_TIME")

            local SAFE_BODY=$(printf '%s' "$RELEASE_DATA" | jq -r '(.body // "无发布说明")[0:1400]')
            local BODY_LEN=$(printf '%s' "$RELEASE_DATA" | jq -r '(.body // "") | length')
            if [ "$BODY_LEN" -gt 1400 ]; then
              SAFE_BODY="${SAFE_BODY}...(发布说明过长已截断)"
            fi

            local ESCAPED_TAG=$(escape_html "$TAG_NAME")
            local ESCAPED_NAME=$(escape_html "$REL_NAME")
            local ESCAPED_BODY=$(escape_html "$SAFE_BODY")

            local REL_TYPE="正式版 (Mainnet/Stable)"
            if [ "$IS_PRE" = "true" ]; then
              REL_TYPE="预发布版 (Pre-release)"
            fi

            local TEXT
            printf -v TEXT '🚀🚨【正式版本发布 / 发版双轨警报】\n\n📦 <b>仓库:</b> <code>%s</code>\n🏷️ <b>版本号:</b> <code>%s</code> (%s)\n📌 <b>版本标题:</b> <code>%s</code>\n🕒 <b>发布时间(北京):</b> <code>%s</code>\n🔗 <b>发版详情:</b> <a href="%s">前往 GitHub Release</a>\n\n📋 <b>更新日志摘要:</b>\n<code>%s</code>' \
              "$TARGET_REPO" "$ESCAPED_TAG" "$REL_TYPE" "$ESCAPED_NAME" "$BEIJING_PUB_TIME" "$REL_URL" "$ESCAPED_BODY"

            send_telegram "$TEXT"
          }

          for TARGET_REPO in "${CLASS_A_REPOS[@]}"; do
            check_repo_commits "$TARGET_REPO" "A"
          done

          for TARGET_REPO in "${CLASS_B_REPOS[@]}"; do
            check_repo_commits "$TARGET_REPO" "B"
            check_repo_release "$TARGET_REPO"
          done
