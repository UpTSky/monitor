name: Token GitHub Monitor (Pure YAML - Optimized)

on:
  schedule:
    # 巧妙避开整点、半点（比如改成第 13 和第 43 分钟），能显著减少 GitHub 的官方调度延迟
    - cron: '13,43 * * * *'
  workflow_dispatch: 

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 砍掉 strategy matrix，合并为单机单线程串行处理，极大提升被 GitHub 响应的优先级
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 使用统一的缓存，单台机器一次读写所有仓库的缓存
      - name: Restore/Save Commit Cache
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .commit_cache
          key: commit-cache-all-repos-${{ github.run_id }}
          restore-keys: |
            commit-cache-all-repos-

      - name: Fetch and Notify All Repos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 完美整合 37 个原生库 + 20 个不重复的新增重磅治理与技术库（共 57 个监控目标）
          REPOS=(
            "ethereum/go-ethereum" "anza-xyz/agave" "bitcoin/bitcoin" "crypto-org-chain/cronos"
            "maticnetwork/bor" "offchainlabs/nitro" "ethereum-optimism/op-geth" "bnb-chain/bsc"
            "ava-labs/avalanchego" "aptos-labs/aptos-core" "monero-project/monero" "IntersectMBO/cardano-node"
            "paritytech/polkadot-sdk" "cosmos/gaia" "ton-blockchain/ton" "mystenlabs/sui"
            "ledgerwatch/erigon" "paradigmxyz/reth" "flashbots/mev-boost" "availproject/avail"
            "celestiaorg/celestia-core" "0xsoniclabs/sonic" "movementlabsxyz/movement" "category-labs/monad"
            "category-labs/monad-bft" "monad-crypto/protocols" "MinaProtocol/mina" "AleoHQ/snarkOS"
            "Electric-Coin-Company/zcash" "ZcashFoundation/zebra" "XRPLF/rippled" "base/base"
            "LayerZero-Labs/LayerZero-v2" "RaoFoundation/subtensor" "berachain/beacon-kit" "filecoin-project/lotus"
            "starknet-io/SNIPs" "stacks-network/stacks-core" "near/nearcore" "sui-foundation/sips"
            "sei-protocol/sei-chain" "matter-labs/zksync-era" "scroll-tech/scroll" "taikoxyz/taiko-mono"
            "Layr-Labs/eigenlayer-contracts" "Layr-Labs/eigenlayer-middleware" "babylonlabs-io/babylon" "hyperlane-xyz/hyperlane-monorepo"
            "jito-foundation/jito-solana" "ArbitrumFoundation/governance" "ethereum/consensus-specs" "sigp/lighthouse"
            "ethereum-optimism/specs" "ZKsync-Association/zk-governance" "matter-labs/era-contracts" "aave-dao/aave-proposals-v3"
            "celestiaorg/celestia-app"
          )

          CACHE_DIR=".commit_cache"
          mkdir -p "$CACHE_DIR"

          # 循环串行处理，对 GitHub 而言这只是一个普通任务
          for TARGET_REPO in "${REPOS[@]}"; do
            echo "----------------------------------------"
            echo "正在检查仓库: $TARGET_REPO"
            
            COMMIT_DATA=$(gh api repos/$TARGET_REPO/commits --jq '.[0] | {sha: .sha, author: .commit.author.name, message: .commit.message, url: .html_url, merge_date: .commit.committer.date}' 2>/dev/null)
            
            if [ -z "$COMMIT_DATA" ] || [ "$COMMIT_DATA" = "null" ]; then
              echo "警告: 无法获取 $TARGET_REPO 的数据，跳过。"
              continue
            fi

            SHA=$(echo "$COMMIT_DATA" | jq -r '.sha')
            REPO_FILE=$(echo "$TARGET_REPO" | tr '/' '_')
            
            if [ -f "$CACHE_DIR/$REPO_FILE" ]; then
              LAST_SHA=$(cat "$CACHE_DIR/$REPO_FILE")
            else
              LAST_SHA=""
            fi

            if [ "$SHA" = "$LAST_SHA" ]; then
              echo "代码未变动，跳过通知。"
            else
              echo "检测到新提交！发送 Telegram 通知..."
              echo "$SHA" > "$CACHE_DIR/$REPO_FILE"
              
              SHORT_SHA=${SHA:0:7}
              AUTHOR=$(echo "$COMMIT_DATA" | jq -r '.author')
              URL=$(echo "$COMMIT_DATA" | jq -r '.url')
              
              UTC_MERGE_TIME=$(echo "$COMMIT_DATA" | jq -r '.merge_date')
              BEIJING_MERGE_TIME=$(TZ="Asia/Shanghai" date -d "$UTC_MERGE_TIME" +"%Y-%m-%d %H:%M:%S" 2>/dev/null || echo "$UTC_MERGE_TIME")
              FULL_MESSAGE=$(echo "$COMMIT_DATA" | jq -r '.message' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

              TEXT=$(cat <<EOF
          🔔 <b>代码变动监控</b>

          📦 <b>仓库:</b> <code>$TARGET_REPO</code>
          👤 <b>提交者:</b> <code>$AUTHOR</code>
          ⏰ <b>代码合并时间(北京):</b> <code>$BEIJING_MERGE_TIME</code>
          🔗 <b>详情:</b> <a href="$URL">查看 Commit ($SHORT_SHA)</a>

          📝 <b>完整变动内容:</b>
          <code>$FULL_MESSAGE</code>
          EOF
              )

              # 直接在循环内发送请求
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "parse_mode=HTML" \
                --data-urlencode "text=${TEXT}" > /dev/null
              
              # 稍微减速防封
              sleep 1
            fi
          done
